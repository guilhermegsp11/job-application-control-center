name: Daily AI Job Hunter
on:
  schedule:
    - cron: '0 7 * * *' # 08:00 CET / 09:00 CEST; GitHub Actions UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search public job feeds
        run: python hunter.py
      - name: Commit updated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          git diff --cached --quiet || (git commit -m 'Update job hunter feed' && git push)
