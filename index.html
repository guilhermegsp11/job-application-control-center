<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Job Hunter</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#17233b;font:14px/1.5 system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:32px 20px}h1{font-size:30px;margin:0}p{color:#66758b}section,article{background:white;border:1px solid #e0e6ef;border-radius:12px;padding:20px;margin:14px 0}.stats{display:flex;gap:16px;flex-wrap:wrap}.stats section{flex:1;min-width:140px}.stats strong{display:block;font-size:28px}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border:1px solid #d5deeb;border-radius:8px;background:white}input{flex:1;min-width:200px}button{cursor:pointer}a{color:#315fe7;font-weight:600}h2{font-size:18px;margin:0}.top{display:flex;justify-content:space-between;gap:12px}.score{color:#16865a;font-weight:700;white-space:nowrap}.meta{color:#66758b}small{color:#66758b}</style></head><body><main><h1>AI Job Hunter</h1><p>Novas oportunidades profissionais · Feed automatizado</p><div class="stats"><section>Total de vagas<strong id="total">—</strong></section><section>Match ≥ 80%<strong id="high">—</strong></section><section>Última atualização<strong id="updated" style="font-size:16px">—</strong></section></div><section><div class="filters"><input id="search" placeholder="Buscar cargo, empresa ou localização"><select id="filter"><option value="0">Todos os matches</option><option value="70">Match ≥ 70%</option><option value="80">Match ≥ 80%</option><option value="90">Match ≥ 90%</option></select><select id="sort"><option value="match">Maior match</option><option value="date">Mais recentes</option></select><button id="refresh">Atualizar feed</button></div><p id="status" role="status">Carregando vagas…</p><small>Match preliminar por palavras-chave; confirme senioridade, idioma, localização e salário antes de aplicar.</small></section><div id="jobs"></div></main><script>
const $=id=>document.getElementById(id);let jobs=[];const str=v=>String(v??'');function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function render(){const q=$('search').value.toLowerCase();const min=Number($('filter').value);const list=jobs.filter(j=>[j.title,j.company,j.location].map(str).join(' ').toLowerCase().includes(q)&&Number(j.match??0)>=min).sort((a,b)=>$('sort').value==='date'?str(b.postedAt).localeCompare(str(a.postedAt)):Number(b.match??0)-Number(a.match??0));$('jobs').replaceChildren();for(const j of list){const card=node('article','');const top=node('div','','top');top.append(node('h2',str(j.title)),node('span',j.match==null?'Match indisponível':j.match+'% match','score'));card.append(top,node('p',[j.company,j.location,j.source,j.postedAt,j.salary].filter(Boolean).join(' · '),'meta'));if(j.reason)card.append(node('p',j.reason));if(j.gaps)card.append(node('p',j.gaps));try{const u=new URL(j.url);if(['https:','http:'].includes(u.protocol)){const a=node('a','Ver vaga original ↗');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}}catch{}$('jobs').append(card)}if(!list.length)$('jobs').append(node('p','Nenhuma vaga corresponde aos filtros.'));}async function load(){try{const r=await fetch('https://raw.githubusercontent.com/guilhermegsp11/job-application-control-center/main/data/jobs.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.jobs))throw Error('Formato inválido');jobs=d.jobs;$('total').textContent=jobs.length;$('high').textContent=jobs.filter(j=>Number(j.match)>=80).length;$('updated').textContent=d.updated?new Date(d.updated).toLocaleString('pt-BR'):'Não informada';$('status').textContent='Feed conectado · '+jobs.length+' vagas';render()}catch(e){$('status').textContent='Não foi possível atualizar o feed: '+e.message+' · Tente novamente.'}}$('search').oninput=render;$('filter').onchange=render;$('sort').onchange=render;$('refresh').onclick=load;load();setInterval(load,300000);
</script></body></html>
